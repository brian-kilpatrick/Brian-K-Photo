seoHeading: Philadelphia Wedding Photographer | NJ Wedding Photographer
introHeading: You're Engaged!
intro: |-
  Now comes the fun part! I'm Brian K, a **Philadelphia & New Jersey wedding photographer & cinematographer**. My style is bold, vibrant, authentic, & modern.

  But enough about me.

  This is ***your*** day, ***your*** love, ***your*** story. I want to beautifully preserve it for a lifetime.

  Wedding planning can be stressful. Let's make this part simple.

  My team and I have you covered with top-notch photography & videography in one place. My mission is not only to deliver a great product, but an amazing, stress-free experience, from first contact to our final email. Our approach is catered to your style and personality as a couple. I will work with you or your team to make sure your day and memories are captured in the best way possible. Take a look around and let's chat!

  \- Brian K
photoTile: /src/assets/home/photo.jpg
