streamingVisible: true
streamingHeading: Live Video Streaming
streaming: |-
  We know, times have been rough lately. Many of you have been forced to make major decisions or alterations to your plans. We are now offering live streaming services to help your loved ones connect with you during this once-in-a-lifetime moment. Whether you are scaling down or thinking of going completely virtual, we've got you covered!

  **Standard Streaming** includes one stationary camera angle streamed to platforms of your choice - starts at $1,000

  **Premium Streaming** includes two stationary camera angles with graphics - starts at $1,250

  **All In Streaming** includes two stationary camera angles with one moving camera: the full broadcast experience! - starts at $1,500
investmentHeading: Investment
investment: |-
  Out of all the investments you make for your big day, photography & videography are one of the few things that will last beyond the day.

  I know every wedding is unique, with unique needs. Please [contact me](/contact) to discuss your special day.

  Individual (Photography or Video) wedding packages start at $3,000 - includes 2 shooters, 6 hours of coverage, and all high resolution digital images.

  Photography & Video packages start at $5,500.

  Fully designed wedding albums and fine art wall prints are also available as package add ons.
