intro: |-
  Vibrant, modern wedding photography for couples in Philadelphia, New Jersey, Delaware, NYC and beyond.

  Real moments, real people and a whole lot of fun, from getting ready to the last dance.
description: >-
  Vibrant, modern wedding photography in Philadelphia, New Jersey, Delaware
  and NYC. See recent weddings by Brian K Photography + Films.
